name: Deploy to GCP Cloud Run

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, closed]

env:
  SERVICE_NAME: smartfridgeapp-api
  SERVICE_NAME_WEB: smartfridgeapp-web
  IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartfridgeapp/api
  IMAGE_WEB: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartfridgeapp/web

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Build & Test (runs on every PR event)
  # ─────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SmartFridgeApp.sln

      - name: Build
        run: dotnet build SmartFridgeApp.sln --no-restore --configuration Release

      - name: Run unit tests
        run: >
          dotnet test
          test/SmartFridgeApp.UnitTests/SmartFridgeApp.UnitTests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.xml"

  # ─────────────────────────────────────────────
  # Job 2: Deploy (only when PR is actually merged)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: test
    if: github.event.pull_request.merged == true
    environment: prod
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Authenticate using a service account key stored as a GitHub secret.
      # See docs/ARCHITECTURE.md for how to generate GCP_SA_KEY.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      # Build from root-level Dockerfile (multi-stage, self-contained)
      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      # Deploy to Cloud Run.
      # Cloud SQL Auth Proxy sidecar is injected automatically via --add-cloudsql-instances.
      # No VPC connector needed when Cloud SQL has a public IP — the proxy uses IAM + TLS.
      # All secrets are pulled from GCP Secret Manager and exposed as env vars at runtime.
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ secrets.GCP_REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: >-
            --add-cloudsql-instances=${{ secrets.CLOUD_SQL_INSTANCE }}
            --allow-unauthenticated
            --port=8080
            --memory=512Mi
            --min-instances=0
            --max-instances=2
            --service-account=${{ secrets.CLOUD_RUN_SA_EMAIL }}
          env_vars: |
            ASPNETCORE_ENVIRONMENT=Production
          secrets: |
            SmartFridgeAppConnectionString__ConnectionString=db-connection-string:latest
            Jwt__SecretKey=jwt-secret-key:latest
            Jwt__Issuer=jwt-issuer:latest
            Jwt__Audience=jwt-audience:latest
            FrontendUrl=frontend-url:latest
            Google__ClientId=google-client-id:latest
            Google__ClientSecret=google-client-secret:latest

      - name: Print deployed URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ secrets.GCP_REGION }} \
            --format='value(status.url)')
          echo "::notice title=Deployed API URL::$URL"
          echo "API deployed to: $URL"

  # ─────────────────────────────────────────────
  # Job 3: Deploy frontend to Cloud Run
  # ─────────────────────────────────────────────
  deploy-web:
    name: Deploy Web to Cloud Run
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event.pull_request.merged == true
    environment: prod
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      # Get backend URL so Vite can bake it into the JS bundle at build time
      - name: Get backend Cloud Run URL
        id: backend_url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ secrets.GCP_REGION }} \
            --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -f ui/SmartFridgeApp.Web/smartfridgeapp-web/Dockerfile \
            --build-arg VITE_SERVER_URL=${{ steps.backend_url.outputs.url }} \
            -t ${{ env.IMAGE_WEB }}:${{ github.sha }} \
            -t ${{ env.IMAGE_WEB }}:latest \
            ui/SmartFridgeApp.Web/smartfridgeapp-web

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_WEB }}:${{ github.sha }}
          docker push ${{ env.IMAGE_WEB }}:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME_WEB }}
          region: ${{ secrets.GCP_REGION }}
          image: ${{ env.IMAGE_WEB }}:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --port=80
            --memory=256Mi
            --min-instances=0
            --max-instances=2
            --service-account=${{ secrets.CLOUD_RUN_SA_EMAIL }}

      - name: Print deployed URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME_WEB }} \
            --region=${{ secrets.GCP_REGION }} \
            --format='value(status.url)')
          echo "::notice title=Deployed Web URL::$URL"
          echo "Web deployed to: $URL"
